[tools]
bats = "1.13.0"
shellcheck = "0.11.0"
yq = "4.48.1"
jq = "1.8.1"

[settings]
pin = true
lockfile = true

[tasks.lint]
run = "shellcheck lib/*.sh"

[tasks.test]
run = "bats tests/"

[tasks."test-unit"]
description = "the suites that need no network"
run = "bats tests/contract.bats"

[tasks.ci-unit]
run = [{ task = ":lint" }, { task = ":test-unit" }]

[tasks.checklist]
run = [{ task = ":lint" }, { task = ":test" }]
