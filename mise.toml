[tools]
bats = "1.13.0"
shellcheck = "0.11.0"
yq = "4.48.1"
jq = "1.8.1"
zizmor = "1.29.0"
"ubi:shenwei356/rush" = "0.9.0"

[settings]
pin = true
lockfile = true

[tasks.lint]
# discovers tracked shell files rather than listing them, so a new one is
# caught automatically; xargs -r skips the run when nothing matches yet.
# common/*.sh (install.sh) is included: it ships into every generated
# project, so it is linted here same as the toolbox's own scripts.
run = "git ls-files -- scaffold 'lib/*.sh' 'scripts/*.sh' 'common/*.sh' | xargs -r shellcheck"

[tasks.test]
# --jobs changes no isolation: bats already gives every test its own process
# and BATS_TEST_TMPDIR, and no suite shares a fixture. A broken lib/adapter.sh
# surfaced 85 seconds in, against 30 minutes sequentially.
run = "bats --jobs $(nproc) --parallel-binary-name rush tests/"

[tasks."test-unit"]
description = "the suites with no adapter generator anywhere in setup — genuinely offline"
# Listed explicitly: a `tests/new-*.bats` glob was wrong in both directions —
# new-project.bats generates no adapter, while add-app, docs and compose all
# do. provenance.bats is offline too but needs an upstream clone, so it runs
# in .github/workflows/provenance.yml instead.
run = "bats --jobs $(nproc) --parallel-binary-name rush tests/add-app-errors.bats tests/cli.bats tests/contract.bats tests/documentation.bats tests/new-project.bats tests/service.bats tests/wizard.bats"

[tasks."test-integration"]
description = "suites that generate a real adapter project as a fixture (not a per-adapter smoke test — see tests/new-*.bats for those)"
run = "bats --jobs $(nproc) --parallel-binary-name rush tests/add-app.bats tests/compose.bats tests/docs.bats tests/workflows.bats tests/wizard-integration.bats"

[tasks."test-runner"]
description = "both test lanes under the environment a github runner actually has"
# What jdx/mise-action exports on every runner. pnpm turns on
# --frozen-lockfile whenever CI is set and mise auto-trusts every config, so a
# green run without these says nothing about the runner — three CI failures in
# a row came from exactly that gap.
env = { CI = "true", GITHUB_ACTIONS = "true", MISE_YES = "1" }
run = [{ task = "test-unit" }, { task = "test-integration" }]

[tasks.ci-unit]
run = [{ task = "lint" }, { task = "test-unit" }]

[tasks.checklist]
run = [{ task = "lint" }, { task = "test" }]
