[tools]
bats = "1.13.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
yq = "4.48.1"
jq = "1.8.1"
zizmor = "1.29.0"
"ubi:shenwei356/rush" = "0.9.0"
# The same versions common/mise.root.toml pins into generated projects.
lefthook = "2.1.11"
gitleaks = "8.30.0"

[settings]
pin = true
lockfile = true

[tasks.lint]
run = [
  "git ls-files -z -- scaffold '*.sh' '*.bash' '*.bats' | xargs -0 -r shellcheck",
  "git ls-files -z -- scaffold '*.sh' '*.bash' '*.bats' | xargs -0 -r shfmt -i 2 -ci -d",
]

[tasks.test]
run = "bats --jobs $(nproc) --parallel-binary-name rush tests/"

[tasks."test-unit"]
description = "the suites with no adapter generator anywhere in setup — genuinely offline"
# Listed, not globbed: new-project.bats generates no adapter; provenance.bats
# needs an upstream clone (runs in provenance.yml).
run = "bats --jobs $(nproc) --parallel-binary-name rush tests/add-app-errors.bats tests/cli.bats tests/contract.bats tests/documentation.bats tests/install.bats tests/new-project.bats tests/pnpm.bats tests/publish.bats tests/service.bats tests/update.bats tests/wizard.bats"

[tasks."test-integration"]
description = "suites that generate a real adapter project as a fixture (not a per-adapter smoke test — see tests/new-*.bats for those)"
run = "bats --jobs $(nproc) --parallel-binary-name rush tests/add-app.bats tests/compose.bats tests/docs.bats tests/workflows.bats tests/wizard-integration.bats"

[tasks."test-runner"]
description = "both test lanes under the environment a github runner actually has"
# The env jdx/mise-action sets on runners: CI makes pnpm use --frozen-lockfile.
env = { CI = "true", GITHUB_ACTIONS = "true", MISE_YES = "1" }
run = [{ task = "test-unit" }, { task = "test-integration" }]

[tasks.ci-unit]
run = [{ task = "lint" }, { task = "test-unit" }]

[tasks.checklist]
run = [{ task = "lint" }, { task = "test" }]
