services:
  cache:
    # Block style here: yq's merge keeps its first input's style, and a flow-style
    # prod command overruns prettier's print width.
    command:
      - redis-server
      - --requirepass
      - '${REDIS_PASSWORD:-app}'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-app}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
