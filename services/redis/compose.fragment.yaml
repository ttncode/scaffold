services:
  cache:
    # Block style, and it has to be block *here*: yq's merge keeps the style of
    # its first input, so the prod fragment below inherits it. In flow style the
    # assembled prod command runs past prettier's print width, and the project's
    # own pre-commit hook rewrites the compose.yaml scaffold just handed it.
    command:
      - redis-server
      - --requirepass
      - '${REDIS_PASSWORD:-app}'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-app}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
