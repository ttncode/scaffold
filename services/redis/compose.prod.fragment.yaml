services:
  cache:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cache:/data
    restart: always
volumes:
  # {}, not a bare key: a YAML null merges into service.bats' "!= null"
  # check as null, and compose treats the two identically anyway.
  cache: {}
