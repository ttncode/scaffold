packages:
  - apps/*
  - packages/*
  - docs
# unrs-resolver (pulled in by typescript-eslint) ships a native postinstall
# build; pnpm blocks an unreviewed build script on first install in a
# workspace instead of just warning, which would abort ci-unit non-interactively.
# it has a pure-js fallback, so denying the build is safe.
allowBuilds:
  unrs-resolver: false
