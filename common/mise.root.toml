monorepo_root = true

# Read by `scaffold add` to wire a new application to the same services.
# Editing them migrates nothing (toolbox ADR-0019).
[vars]
database = "@DATABASE@"
cache = "@CACHE@"

# apps/web publishes as <image>-web (ADR-0022). `scaffold add`, compose.yaml
# and the build workflows must all name this one string.
image = "ghcr.io/you/@PROJECT_NAME@"

[monorepo]
config_roots = [
  "docs",
]

[tools]
node = "24.15.0"
pnpm = "11.21.0"
lefthook = "2.1.11"
gitleaks = "8.30.0"

[settings]
pin = true
lockfile = true

[tasks.dev]
interactive = true
run = "docker compose -f compose.dev.yaml up --remove-orphans"

[tasks.secrets]
description = "scan the whole history for secrets"
run = "gitleaks git --redact --no-banner"

[tasks."dev-down"]
run = "docker compose -f compose.dev.yaml down --remove-orphans"

[tasks.checklist]
run = [{ task = "//docs:checklist" }]
