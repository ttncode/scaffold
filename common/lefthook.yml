# `mise exec --`: these tools exist only in mise.toml, and lefthook's `rc:` is
# baked into .git/hooks at install time.
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml,css}'
      run: mise exec -- pnpm exec prettier --write {staged_files}
      stage_fixed: true
    gitleaks:
      run: mise exec -- gitleaks protect --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: mise exec -- pnpm exec commitlint --edit {1}

pre-push:
  commands:
    checklist:
      run: mise run checklist
