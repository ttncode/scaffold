# Every command runs through `mise exec --`, so only mise itself has to be on
# PATH. The tools these hooks call — pnpm, gitleaks — are pinned in this
# project's mise.toml and exist nowhere else, so calling them bare works only
# in a shell where mise is already activated. A plain `git commit` then fails
# with `gitleaks: not found`, which says nothing about what to do; the same
# commit succeeds under `mise exec`. lefthook's own `rc:` key could export the
# environment once instead, but it is baked into .git/hooks at install time,
# so editing it without re-running `lefthook install` drifts silently.
#
# pint is the exception: it is invoked by path from the app that vendors it,
# which needs no PATH lookup at all.
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml,css}"
      run: mise exec -- pnpm exec prettier --write {staged_files}
      stage_fixed: true
    gitleaks:
      run: mise exec -- gitleaks protect --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: mise exec -- pnpm exec commitlint --edit {1}

pre-push:
  commands:
    checklist:
      run: mise run checklist
