name: Release
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  release:
    # a called workflow cannot request more than its caller was granted, and
    # the workflow-level `permissions: {}` above grants nothing — so this is
    # the union of what app-release's own jobs ask for, and no more.
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    # A moving major tag, on purpose (ADR-0005): one fix reaches every project
    # at once, without a pull request into each. The third-party actions inside
    # are sha-pinned.
    #
    # What that costs, stated plainly because the tag outlives the engagement:
    # this is a write channel into this repository's CI that survives handover
    # and any revoked access, and release.yml grants the called workflow
    # contents: write, packages: write and the release app's private key. One
    # force-push of the tag reaches every project generated from this toolbox
    # simultaneously, with no review and no signal here. Accepted, not solved —
    # sha-pinning with Renovate is the alternative, and it gives up the
    # one-fix-reaches-everything the tag was chosen for.
    uses: you/.github/.github/workflows/app-release.yml@v1 # zizmor: ignore[unpinned-uses,ref-confusion]
    # release please opens its pull request as a github app when the repository
    # has RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, so the checks on that pull
    # request run instead of waiting on a manual approval that expires red.
    # Without those secrets it falls back to GITHUB_TOKEN and still releases.
    # Named rather than `inherit`: a called workflow that inherits everything
    # gets secrets it has no business reading, and the two it does need are
    # already declared optional on the other side.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    with:
      image: ghcr.io/you/@PROJECT_NAME@
      context: apps/api
