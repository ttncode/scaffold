name: Build
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    # what app-build's jobs need; `permissions: {}` above leaves nothing to inherit.
    permissions:
      contents: read
      packages: write
    # `@v1` floats on purpose: one fix reaches every project (ADR-0005).
    uses: you/.github/.github/workflows/app-build.yml@v1 # zizmor: ignore[unpinned-uses,ref-confusion]
    with:
      # {image, context, dockerfile} per application, written by scaffold (ADR-0022).
      images: "[]"
