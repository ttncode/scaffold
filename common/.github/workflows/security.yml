name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions: {}
jobs:
  security:
    # a called workflow cannot request more than its caller was granted, and
    # the workflow-level `permissions: {}` above grants nothing — so this is
    # the union of what app-security's own jobs ask for, and no more.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    # A moving major tag, on purpose (ADR-0005): one fix reaches every project
    # at once, without a pull request into each. The third-party actions inside
    # are sha-pinned.
    #
    # What that costs, stated plainly because the tag outlives the engagement:
    # this is a write channel into this repository's CI that survives handover
    # and any revoked access, and release.yml grants the called workflow
    # contents: write, packages: write and the release app's private key. One
    # force-push of the tag reaches every project generated from this toolbox
    # simultaneously, with no review and no signal here. Accepted, not solved —
    # sha-pinning with Renovate is the alternative, and it gives up the
    # one-fix-reaches-everything the tag was chosen for.
    uses: you/.github/.github/workflows/app-security.yml@v1 # zizmor: ignore[unpinned-uses,ref-confusion]
