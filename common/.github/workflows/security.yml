name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
permissions: {}
jobs:
  security:
    # what app-security's jobs need; `permissions: {}` above leaves nothing to inherit.
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    # `@v1` floats on purpose: one fix reaches every project (ADR-0005).
    uses: you/.github/.github/workflows/app-security.yml@v1 # zizmor: ignore[unpinned-uses,ref-confusion]
