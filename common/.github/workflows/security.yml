name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions: {}
jobs:
  security:
    # a called workflow cannot request more than its caller was granted, and
    # the workflow-level `permissions: {}` above grants nothing — so this is
    # the union of what app-security's own jobs ask for, and no more.
    permissions:
      contents: read
      security-events: write
    # This account's own reusable workflow, tracked by a moving major tag on
    # purpose (ADR-0005) so one fix reaches every project at once. The
    # third-party actions inside it are still sha-pinned; the trade-off is
    # scoped to a repository this account controls.
    uses: you/.github/.github/workflows/app-security.yml@v1 # zizmor: ignore[unpinned-uses,ref-confusion]
