name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  ci:
    # what app-ci's jobs need; `permissions: {}` above leaves nothing to inherit.
    permissions:
      contents: read
      pull-requests: read
    # `@v1` floats on purpose: one fix reaches every project (ADR-0005).
    uses: you/.github/.github/workflows/app-ci.yml@v1 # zizmor: ignore[unpinned-uses,ref-confusion]
    with:
      roots: '["docs"]'
