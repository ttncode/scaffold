[tasks.install]
# The first frozen install after this package joins the workspace relinks
# node_modules, and pnpm must not stop to ask.
env = { npm_config_confirm_modules_purge = "false" }
run = "pnpm install --frozen-lockfile"

[tasks.format]
run = "pnpm exec prettier --check ."

[tasks."format-fix"]
run = "pnpm exec prettier --write ."

[tasks.lint]
run = "pnpm exec eslint \"src/**/*.ts\" --max-warnings 0"

[tasks.check]
run = "pnpm exec tsc --noEmit"

[tasks.test]
run = "pnpm exec vitest --run --passWithNoTests"

[tasks.build]
run = "true"

[tasks.ci-unit]
# same reason as :install's env above — ci-unit calls :install too.
env = { npm_config_confirm_modules_purge = "false" }
run = [{ task = ":install" }, { task = ":format" }, { task = ":check" }]

[tasks.checklist]
run = [{ task = ":ci-unit" }]
