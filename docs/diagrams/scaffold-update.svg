<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scaffold-update-title scaffold-update-desc">
  <title id="scaffold-update-title">What scaffold update does</title>
  <desc id="scaffold-update-desc">Flowchart of scaffold update: read the toolbox commit recorded in .scaffold.toml, diff common and each adapter since then, stop if the patch is empty or print it on --dry-run, otherwise apply it hunk by hunk, re-derive computed files and record the new version.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <path d="M280,88 V120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M280,176 V208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M280,264 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360,336 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M280,376 V408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M360,448 H500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M280,488 V520" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M280,576 V608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="418" y="316" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="432" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
  <rect x="288" y="386" width="20" height="12" rx="2" fill="#f5f5f5"/>
  <text x="292" y="395" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO</text>
  <rect x="418" y="428" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="432" y="437" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
  <rect x="288" y="498" width="20" height="12" rx="2" fill="#f5f5f5"/>
  <text x="292" y="507" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO</text>
  <rect x="120" y="40" width="320" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="120" y="40" width="320" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="280" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">scaffold update [dir]</text>
  <rect x="120" y="120" width="320" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="120" y="120" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read the recorded commit</text>
  <text x="280" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolve_project · update_source_commit</text>
  <rect x="120" y="208" width="320" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="120" y="208" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diff the toolbox since then</text>
  <text x="280" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">update_patch: common/ + each adapter</text>
  <polygon points="280,296 360,336 280,376 200,336" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="333" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Patch</text>
  <text x="280" y="347" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">empty?</text>
  <rect x="500" y="312" width="200" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="500" y="312" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="600" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Already up to date</text>
  <polygon points="280,408 360,448 280,488 200,448" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="452" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--dry-run?</text>
  <rect x="500" y="424" width="200" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="500" y="424" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="600" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Print the patch</text>
  <rect x="120" y="520" width="320" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="120" y="520" width="320" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="280" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apply what fits</text>
  <text x="280" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clean tree · git apply --reject</text>
  <rect x="120" y="608" width="320" height="56" rx="28" fill="#f5f5f5"/>
  <rect x="120" y="608" width="320" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="280" y="636" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-derive and record</text>
  <text x="280" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resync_derived_files · version</text>
  <line x1="40" y1="696" x2="680" y2="696" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="712" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="40" y="724" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="72" y="734" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Start / end</text>
  <rect x="220" y="724" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="252" y="734" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Step</text>
  <polygon points="400,730 412,724 424,730 412,736" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="432" y="734" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Decision</text>
</svg>
