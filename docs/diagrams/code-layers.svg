<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-layers-title code-layers-desc">
  <title id="code-layers-title">How the toolbox code is layered</title>
  <desc id="code-layers-desc">Layer stack showing the scaffold entry point over the wizard, the project lifecycle libraries, the app and service assembly libraries, shared primitives, and the adapters, services and common directories they read.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CALLS</text>
  <line x1="72" y1="80" x2="72" y2="464" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <polygon points="68,464 76,464 72,472" fill="#4f5d75"/>
  <text x="40" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">READS</text>
  <rect x="160" y="80" width="800" height="64" fill="#ffffff"/>
  <line x1="160" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="180" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
  <text x="224" y="118" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Entry point</text>
  <text x="940" y="117" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">scaffold · main() → cmd_new, cmd_add, cmd_update, cmd_publish, cmd_list, cmd_lint</text>
  <rect x="160" y="144" width="800" height="64" fill="#f5f5f5"/>
  <line x1="160" y1="208" x2="960" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="180" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
  <text x="224" y="182" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Wizard</text>
  <text x="940" y="181" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">lib/wizard.sh · lib/tui.sh (no arguments, on a terminal)</text>
  <rect x="160" y="208" width="800" height="64" fill="#ffffff"/>
  <line x1="160" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="180" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
  <text x="224" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Project lifecycle</text>
  <text x="940" y="245" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">lib/project.sh · lib/update.sh · lib/publish.sh · lib/lint.sh</text>
  <rect x="160" y="272" width="800" height="64" fill="rgba(235,108,54,0.08)"/>
  <rect x="160" y="272" width="800" height="64" fill="none" stroke="#eb6c36" stroke-width="1"/>
  <text x="180" y="308" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
  <text x="224" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Apps and services</text>
  <text x="940" y="309" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">lib/adapter.sh · lib/service.sh · lib/pnpm.sh · lib/manifest.sh</text>
  <rect x="160" y="336" width="800" height="64" fill="#ffffff"/>
  <line x1="160" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="180" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
  <text x="224" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Shared primitives</text>
  <text x="940" y="373" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">lib/log.sh · lib/contract.sh</text>
  <rect x="160" y="400" width="800" height="64" fill="#ececec"/>
  <line x1="160" y1="464" x2="960" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="180" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
  <text x="224" y="438" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Data it reads</text>
  <text x="940" y="437" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">adapters/&lt;name&gt;/ · services/&lt;name&gt;/ · common/</text>
  <line x1="160" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
  <text x="160" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
  <text x="264" y="508" fill="#4f5d75" font-size="9" font-style="italic" font-family="'Geist', sans-serif">Every lib/*.sh is sourced into one shell by scaffold; L4 is where an adapter or service becomes files in the project.</text>
</svg>
