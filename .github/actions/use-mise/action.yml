name: Use mise
description: jdx/mise-action with the mise binary pinned
runs:
  using: composite
  steps:
    # Pinned, not left to the action's newest-release default, so a new mise
    # release reaches CI only when bumped here (as immich-app/devtools'
    # use-mise does). The unit lane started failing on 2026.10.10.
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.10.5
