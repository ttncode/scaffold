name: Adapters
on:
  pull_request:
  schedule:
    # nightly: tier a only (docs/decisions/0012)
    - cron: "17 3 * * *"
    # weekly: every tier plus compose; must equal scripts/adapter-matrix.sh's WEEKLY_CRON
    - cron: "23 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tier-a: ${{ steps.tiers.outputs.tier-a }}
      tier-b: ${{ steps.tiers.outputs.tier-b }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Discover the adapter tiers
        id: tiers
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          ./scripts/adapter-matrix.sh "$EVENT_NAME" "$SCHEDULE_CRON"
          "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  smoke:
    needs: discover
    if: ${{ needs.discover.outputs.tier-a != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.discover.outputs.tier-a) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Enable corepack
        run: corepack enable
      - name: Detect the adapter language
        id: language
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          lang="$(grep '^ADAPTER_LANGUAGE=' "adapters/${ADAPTER}/adapter.env" | cut -d'"' -f2)"
          echo "value=${lang}" >> "$GITHUB_OUTPUT"
      - name: Setup PHP
        if: steps.language.outputs.value == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Run the tier-a smoke test
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: bats "tests/new-${ADAPTER}.bats"

  smoke-tier-b:
    needs: discover
    if: ${{ needs.discover.outputs.tier-b != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # ~5 minutes per test, five tests per adapter (docs/decisions/0012)
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.discover.outputs.tier-b) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Enable corepack
        run: corepack enable
      - name: Detect the adapter language
        id: language
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          lang="$(grep '^ADAPTER_LANGUAGE=' "adapters/${ADAPTER}/adapter.env" | cut -d'"' -f2)"
          echo "value=${lang}" >> "$GITHUB_OUTPUT"
      - name: Setup PHP
        if: steps.language.outputs.value == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Run the tier-b smoke test
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: bats "tests/new-${ADAPTER}.bats"

  deploy:
    needs: discover
    if: ${{ needs.discover.outputs.tier-a != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.discover.outputs.tier-a) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Enable corepack
        run: corepack enable
      - name: Detect the adapter language
        id: language
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          lang="$(grep '^ADAPTER_LANGUAGE=' "adapters/${ADAPTER}/adapter.env" | cut -d'"' -f2)"
          echo "value=${lang}" >> "$GITHUB_OUTPUT"
      - name: Setup PHP
        if: steps.language.outputs.value == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Run the deploy check
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: ./scripts/deploy-check.sh "$ADAPTER"

  deploy-tier-b:
    needs: discover
    if: ${{ needs.discover.outputs.tier-b != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJson(needs.discover.outputs.tier-b) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Enable corepack
        run: corepack enable
      - name: Detect the adapter language
        id: language
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          lang="$(grep '^ADAPTER_LANGUAGE=' "adapters/${ADAPTER}/adapter.env" | cut -d'"' -f2)"
          echo "value=${lang}" >> "$GITHUB_OUTPUT"
      - name: Setup PHP
        if: steps.language.outputs.value == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Run the deploy check
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: ./scripts/deploy-check.sh "$ADAPTER"

  deploy-multi-app:
    # The only proof two applications come up on two images (ADR-0022).
    if: ${{ github.event.schedule == '23 2 * * 1' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Enable corepack
        run: corepack enable
      - name: Run the deploy check for two apps
        run: ./scripts/deploy-check.sh nextjs nestjs --db postgres

  compose:
    if: ${{ github.event.schedule == '23 2 * * 1' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Run the compose tests
        run: bats tests/compose.bats

  services:
    # The full grid is nightly; a pull request gets the default cell via tests/new-*.bats.
    if: ${{ github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        adapter: [laravel-api, nestjs]
        db: [mysql, postgres, mongodb, none]
        cache: [none, redis]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Enable corepack
        run: corepack enable
      - name: Detect the adapter language
        id: language
        env:
          ADAPTER: ${{ matrix.adapter }}
        run: |
          lang="$(grep '^ADAPTER_LANGUAGE=' "adapters/${ADAPTER}/adapter.env" | cut -d'"' -f2)"
          echo "value=${lang}" >> "$GITHUB_OUTPUT"
      - name: Setup PHP
        if: steps.language.outputs.value == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Generate the project and run its checklist
        env:
          ADAPTER: ${{ matrix.adapter }}
          DB: ${{ matrix.db }}
          CACHE: ${{ matrix.cache }}
          # A runner has neither `gh auth` nor git's github.user to fall back on.
          SCAFFOLD_GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          work="$(mktemp -d)"
          ./scaffold new "${work}/demo" --api "$ADAPTER" --db "$DB" --cache "$CACHE"
          cd "${work}/demo"
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.test.yaml config --quiet
          mise run //apps/api:checklist

  notify-on-schedule-failure:
    # Nobody watches the schedule tab; a red scheduled run becomes an issue.
    if: >-
      ${{ always() && github.event_name == 'schedule' &&
      (needs.smoke.result == 'failure' || needs.smoke-tier-b.result == 'failure' ||
       needs.deploy.result == 'failure' || needs.deploy-tier-b.result == 'failure' ||
       needs.deploy-multi-app.result == 'failure' ||
       needs.compose.result == 'failure' || needs.services.result == 'failure') }}
    needs: [smoke, smoke-tier-b, deploy, deploy-tier-b, deploy-multi-app, compose, services]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --repo "${{ github.repository }}"
          --title "weekly adapter smoke failed ($(date -u +%F))"
          --body "see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
