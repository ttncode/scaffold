# composer only: mise's php backends compile from source and fail here, so php
# comes from the system (ADR-0016). It stays declared in this file alone — the
# root mise.toml never learns this app is php.
[tools]
"ubi:composer/composer" = "2.10.2"

[tasks.install]
# mise installs composer as composer.phar, not composer
run = [
  "php -r 'exit(version_compare(PHP_VERSION, \"8.3.0\", \">=\") ? 0 : 1);' || { echo \"laravel-api requires system php >= 8.3.0 (found $(php -r 'echo PHP_VERSION;' 2>/dev/null || echo 'no php on PATH')); install php 8.3 or newer via your OS package manager (e.g. apt install php8.3-cli) or https://php.net, then re-run mise install\" >&2; exit 1; }",
  "composer.phar install --no-interaction --prefer-dist",
]

[tasks.format]
run = "./vendor/bin/pint --test"

[tasks."format-fix"]
run = "./vendor/bin/pint"

# pint is both formatter and linter; an honest duplicate beats inventing a
# second linter to fill the slot
[tasks.lint]
run = "./vendor/bin/pint --test"

[tasks.check]
run = "./vendor/bin/phpstan analyse --no-progress --memory-limit=512M"

[tasks.test]
# APP_KEY lives in the uncommitted .env, so a fresh checkout has none and every
# test that boots the app dies on MissingAppKeyException. A throwaway key beats
# committing a real one into every project this toolbox makes.
run = "APP_KEY=base64:$(head -c 32 /dev/urandom | base64) ./vendor/bin/phpunit"

[tasks.build]
# --no-dev strips pint, phpstan and phpunit from vendor/, and the pre-commit
# hook calls ./vendor/bin/pint directly — so the next commit fails on a missing
# binary. Put them back; `status=$?` keeps the production install's exit code.
# The real artifact is the Dockerfile's own --no-dev install.
run = "composer.phar install --no-dev --optimize-autoloader --classmap-authoritative; status=$?; composer.phar install --no-interaction --prefer-dist --quiet; exit $status"

[tasks.migrate]
run = "php artisan migrate --force"

[tasks.ci-unit]
# :lint runs the same pint invocation as :format here, so this repeats about
# half a second of work. Listed anyway: every other adapter runs all five, and
# an omission that reads as deliberate is indistinguishable from one that is
# not — the day pint stops being both halves, the missing call would go
# unnoticed in CI.
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [{ task = ":ci-unit" }, { task = ":build" }]
