# composer is the only tool pinned here — mise's php backends compile from
# source and this machine's build fails on missing system libraries, so php
# comes from the system instead (see the scaffold toolbox's ADR-0016, not
# shipped here). php still lives only in this file and nowhere else in the
# project: the root mise.toml never learns that this app is written in php.
[tools]
"ubi:composer/composer" = "2.10.2"

[tasks.install]
# composer resolves to a phar named composer.phar, not composer, once mise
# installs it — invoke it by that name everywhere in this file.
run = [
  "php -r 'exit(version_compare(PHP_VERSION, \"8.3.0\", \">=\") ? 0 : 1);' || { echo \"laravel-api requires system php >= 8.3.0 (found $(php -r 'echo PHP_VERSION;' 2>/dev/null || echo 'no php on PATH')); install php 8.3 or newer via your OS package manager (e.g. apt install php8.3-cli) or https://php.net, then re-run mise install\" >&2; exit 1; }",
  "composer.phar install --no-interaction --prefer-dist",
]

[tasks.format]
run = "./vendor/bin/pint --test"

[tasks."format-fix"]
run = "./vendor/bin/pint"

# pint is both formatter and style linter, so lint runs the same binary as
# format. an honest duplicate beats inventing a second linter to fill the
# slot.
[tasks.lint]
run = "./vendor/bin/pint --test"

[tasks.check]
run = "./vendor/bin/phpstan analyse --no-progress --memory-limit=512M"

[tasks.test]
# the skeleton ships phpunit, not pest — pest is opt-in and adds nothing
# here; run what the generator already ships.
#
# laravel reads APP_KEY from .env, which is not committed, so a fresh checkout
# has none and every test that boots the app dies on MissingAppKeyException.
# The tests run against an in-memory database and encrypt nothing that outlives
# them, so a throwaway key generated per run is enough — and beats committing
# one real key into every project this toolbox makes.
run = "APP_KEY=base64:$(head -c 32 /dev/urandom | base64) ./vendor/bin/phpunit"

[tasks.build]
# --no-dev strips pint, phpstan and phpunit out of vendor/, and lefthook's
# pre-commit hook calls ./vendor/bin/pint directly — so building in place makes
# the next commit fail on a missing binary, and pre-push runs checklist, which
# runs this. Build into a throwaway tree instead. The real artifact is built by
# the Dockerfile, which does its own --no-dev install on a clean checkout.
env = { COMPOSER_VENDOR_DIR = "vendor-dist" }
run = "composer.phar install --no-dev --optimize-autoloader --classmap-authoritative"

[tasks.migrate]
run = "php artisan migrate --force"

[tasks.ci-unit]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [{ task = ":ci-unit" }, { task = ":build" }]
