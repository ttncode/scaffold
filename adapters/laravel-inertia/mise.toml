# composer is pinned the same way as laravel-api's (see the scaffold
# toolbox's ADR-0016 for why php itself is not — not shipped here); a
# fullstack laravel app still needs node, because vite builds the assets —
# the honest consequence of picking laravel to get one app instead of two,
# and someone choosing it to avoid node should learn that here, not in ci.
[tools]
"ubi:composer/composer" = "2.10.2"
node = "24.15.0"

[tasks.install]
# composer resolves to a phar named composer.phar, not composer, once mise
# installs it — invoke it by that name everywhere in this file.
run = [
  "php -r 'exit(version_compare(PHP_VERSION, \"8.3.0\", \">=\") ? 0 : 1);' || { echo \"laravel-inertia requires system php >= 8.3.0 (found $(php -r 'echo PHP_VERSION;' 2>/dev/null || echo 'no php on PATH')); install php 8.3 or newer via your OS package manager (e.g. apt install php8.3-cli) or https://php.net, then re-run mise install\" >&2; exit 1; }",
  "composer.phar install --no-interaction --prefer-dist",
  "npm ci",
]

# the starter kit's frontend toolchain is vite-plus, whose `vp check` covers
# formatting and linting in one command — there is no separate format:check or
# lint:check script to call. Scoped to resources/ because an unscoped run also
# formats this file, and its idea of toml style is not this toolbox's.
[tasks.format]
run = ["./vendor/bin/pint --test", "npm run check -- resources"]

[tasks."format-fix"]
run = ["./vendor/bin/pint", "npm run check:fix -- resources"]

# both halves of lint are already formatters that lint: pint on the php side,
# vp on the frontend. Same honest duplicate as laravel-api rather than a second
# linter invented to fill the slot.
[tasks.lint]
run = ["./vendor/bin/pint --test", "npm run check -- resources"]

[tasks.check]
run = ["./vendor/bin/phpstan analyse --no-progress --memory-limit=512M", "npm run types:check"]

[tasks.test]
# the starter kit ships phpunit, not pest — pest is opt-in and adds nothing
# here; run what the generator already ships.
#
# same uncommitted-.env problem as laravel-api: APP_KEY lives there, so a fresh
# checkout has none and every test that boots the app dies on
# MissingAppKeyException. A throwaway key per run is enough for tests that hit
# an in-memory database and encrypt nothing that outlives them.
run = "APP_KEY=base64:$(head -c 32 /dev/urandom | base64) ./vendor/bin/phpunit"

[tasks.build]
run = [
  "composer.phar install --no-dev --optimize-autoloader --classmap-authoritative",
  "npm run build",
]

[tasks.migrate]
run = "php artisan migrate --force"

[tasks.ci-unit]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [{ task = ":ci-unit" }, { task = ":build" }]
