# php comes from the system (ADR-0016); node builds the vite assets.
[tools]
"ubi:composer/composer" = "2.10.2"
node = "24.15.0"

[tasks.install]
# mise installs composer as composer.phar, not composer
# `npm run build` here: types:check needs resources/js/{actions,routes} and page
# tests need public/build/manifest.json, both gitignored.
run = [
  "php -r 'exit(version_compare(PHP_VERSION, \"8.3.0\", \">=\") ? 0 : 1);' || { echo \"laravel-inertia requires system php >= 8.3.0 (found $(php -r 'echo PHP_VERSION;' 2>/dev/null || echo 'no php on PATH')); install php 8.3 or newer via your OS package manager (e.g. apt install php8.3-cli) or https://php.net, then re-run mise install\" >&2; exit 1; }",
  "composer.phar install --no-interaction --prefer-dist",
  "npm ci",
  "npm run build",
]

# `vp check` formats and lints; unscoped, it also rewrites this file.
[tasks.format]
run = ["./vendor/bin/pint --test", "npm run check -- resources"]

[tasks."format-fix"]
run = ["./vendor/bin/pint", "npm run check:fix -- resources"]

# pint and vp are formatter and linter both
[tasks.lint]
run = ["./vendor/bin/pint --test", "npm run check -- resources"]

[tasks.check]
run = ["./vendor/bin/phpstan analyse --no-progress --memory-limit=512M", "npm run types:check"]

[tasks.test]
# APP_KEY lives in the uncommitted .env; a throwaway key lets tests boot the app.
run = "APP_KEY=base64:$(head -c 32 /dev/urandom | base64) ./vendor/bin/phpunit"

[tasks.build]
# The second install restores pint for the pre-commit hook; `status=$?` keeps
# the --no-dev install's exit code. The image does its own --no-dev install.
run = [
  "composer.phar install --no-dev --optimize-autoloader --classmap-authoritative; status=$?; composer.phar install --no-interaction --prefer-dist --quiet; exit $status",
  "npm run build",
]

[tasks.migrate]
run = "php artisan migrate --force"

[tasks.ci-unit]
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [{ task = ":ci-unit" }, { task = ":build" }]
