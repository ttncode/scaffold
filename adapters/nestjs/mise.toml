[tasks.install]
# The first frozen install after packages/types joins the workspace relinks
# node_modules, and pnpm must not stop to ask.
env = { npm_config_confirm_modules_purge = "false" }
run = "pnpm install --frozen-lockfile"

[tasks.format]
run = "pnpm exec prettier --check ."

[tasks."format-fix"]
run = "pnpm exec prettier --write ."

[tasks.lint]
run = "pnpm exec eslint \"src/**/*.ts\" \"test/**/*.ts\" --max-warnings 0"

[tasks.prisma]
# tsc checks against the generated client; a --db none project has no schema.
run = "if [ -f prisma/schema.prisma ]; then pnpm exec prisma generate; fi"

[tasks.migrate]
# prisma's mongodb provider rejects `migrate deploy` and takes `db push`.
run = """
if ! [ -f prisma/schema.prisma ]; then exit 0; fi
if grep -q 'provider *= *"mongodb"' prisma/schema.prisma; then
  pnpm exec prisma db push --skip-generate
else
  pnpm exec prisma migrate deploy
fi
"""

[tasks.check]
run = [{ task = ":prisma" }, "pnpm exec tsc --noEmit"]

[tasks.test]
run = "pnpm exec jest --passWithNoTests"

[tasks.build]
run = [{ task = ":prisma" }, "pnpm exec nest build"]

[tasks.ci-unit]
# same reason as :install's env above — ci-unit calls :install too.
env = { npm_config_confirm_modules_purge = "false" }
run = [
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
  { task = ":test" },
]

[tasks.checklist]
run = [{ task = ":ci-unit" }, { task = ":build" }]
