# Mirrors common/lefthook.yml. `mise exec --`: gitleaks exists only in
# mise.toml, and lefthook's `rc:` is baked into .git/hooks at install time.
pre-commit:
  parallel: true
  commands:
    lint:
      # Not a staged-files glob: the lint task already finds extensionless `scaffold`.
      run: mise run lint
    gitleaks:
      run: mise exec -- gitleaks protect --staged --redact --no-banner

commit-msg:
  commands:
    conventional:
      # A grep, not commitlint: this repository has no node.
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert|merge)(\([a-z0-9./-]+\))?!?: .+' || {
          echo "commit message must be a Conventional Commit, e.g. 'fix(tui): flush the command line left'" >&2
          exit 1
        }

# No pre-push gate: CI runs the same suites on every push.
